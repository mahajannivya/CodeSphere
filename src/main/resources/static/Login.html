
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CodeSphere</title>

    <style>

        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI';}

        body{
            min-height:100vh;
            background: linear-gradient(135deg,#f8fafc,#e0f2fe,#f5f5f0);
        }

        /* GLOW */
        .bg1,.bg2{
            position:absolute;width:400px;height:400px;border-radius:50%;
            filter:blur(120px);opacity:0.6;
        }
        .bg1{background:#58a6ff;top:-100px;left:-100px;}
        .bg2{background:#a5b4fc;bottom:-100px;right:-100px;}

        /* TOPBAR */
        .topbar{
            display:flex;justify-content:space-between;
            padding:20px 40px;align-items:center;
        }
        .logo{font-size:24px;color:#1f6feb;}


        /* CENTER */
        .wrapper{
            display:flex;justify-content:center;margin-top:50px;
        }

        /* CARD */
        .container{
            width:420px;
            padding:30px;
            border-radius:20px;
            background:rgba(255,255,255,0.25);
            backdrop-filter:blur(20px);
            box-shadow:0 10px 40px rgba(0,0,0,0.1);
            text-align:center;
        }

        .form-group{margin-bottom:15px;text-align:left;}

        input{
            width:100%;
            padding:10px;
            border-radius:10px;
            border:1px solid rgba(0,0,0,0.1);
            background:rgba(255,255,255,0.6);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:12px;
            background:linear-gradient(90deg,#1f6feb,#58a6ff);
            color:white;
        }
        .back-btn{
    padding:6px 12px;
    border:none;
    border-radius:8px;
    background:rgba(31,111,235,0.1);
    color:#1f6feb;
    cursor:pointer;
    font-size:13px;
    width:auto;            /* key fix */
    display:inline-block;  /* prevents stretching */
}

.back-btn:hover{
    background:#1f6feb;
    color:white;
}

    </style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="topbar">
    <div class="logo">CodeSphere</div>
    <button class="back-btn" onclick="history.back()">Back</button>
</div>

<div class="wrapper">
    <div class="container">

        <h3>Login</h3>

        <form onsubmit="login(event)">

            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>

        </form>

    </div>
</div>

<script>
    function login(e){
    e.preventDefault();
    const emailVal = document.getElementById("email").value;
    const passwordVal = document.getElementById("password").value;



    fetch("/auth/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            email: emailVal,
            password: passwordVal
        })
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Invalid credentials");
        }
        return res.json();
    })
    .then(user => {
        localStorage.setItem("user", JSON.stringify(user));
        alert("Login Successful");
        window.location = "Dashboard.html";
    })
    .catch(err => {
        console.error("Error"+err);
        alert("Login failed");
    });
}

</script>

</body>
</html>
