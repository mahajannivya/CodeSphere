<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | CodeSphere</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background: linear-gradient(135deg,#f8fafc,#e0f2fe,#f5f5f0);
        }

        /* GLOW BACKGROUND */
        .bg1,.bg2{
            position:absolute;
            width:400px;
            height:400px;
            border-radius:50%;
            filter:blur(120px);
            opacity:0.5;
        }
        .bg1{background:#58a6ff;top:-100px;left:-100px;}
        .bg2{background:#a5b4fc;bottom:-100px;right:-100px;}

        /* TOPBAR */
        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
        }

        .logo{
            font-size:26px;
            font-weight:bold;
            color:#1f6feb;
        }

        /* COMPACT BACK BUTTON */
        .back-btn{
            padding:5px 10px;
            font-size:13px;
            border-radius:6px;
            background:transparent;
            color:#1f6feb;
            border:1px solid rgba(31,111,235,0.3);
            cursor:pointer;
        }

        .back-btn:hover{
            background:#1f6feb;
            color:white;
        }

        /* MAIN LAYOUT */
        .container{
            display:flex;
            height:70vh;
            margin-top:30px;
        }

        /* SIDES */
        .side{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }

        /* DESCRIPTION TEXT */
        .section-info{
            text-align:center;
            margin-bottom:10px;
            color:#444;
            font-size:15px;
        }

        /* CARD */
        .card{
            width:80%;
            max-width:380px;
            padding:25px;
            border-radius:20px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            border:1px solid rgba(255,255,255,0.4);
            box-shadow:0 10px 40px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-6px);
            box-shadow:0 20px 50px rgba(31,111,235,0.2);
        }

        .card h2{
            color:#1f6feb;
            margin-bottom:15px;
        }

        /* FORM */
        .form-group{
            margin-bottom:15px;
        }

        input, select{
            width:100%;
            padding:10px;
            border-radius:10px;
            border:1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.6);
            outline:none;
        }

        /* BUTTON */
        button.action{
            width:100%;
            padding:12px;
            border:none;
            border-radius:12px;
            background: linear-gradient(90deg,#1f6feb,#58a6ff);
            color:white;
            cursor:pointer;
            margin-top:10px;
        }

        button.action:hover{
            box-shadow:0 0 15px #58a6ff;
        }

        /* DIVIDER */
        .divider{
            width:1px;
            background:rgba(0,0,0,0.1);
        }

        .small{
            font-size:12px;
            color:#666;
            margin-top:5px;
        }

    </style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">CodeSphere</div>
    <button class="back-btn" onclick="window.location.href='index.html'">Back</button>
</div>

<!-- MAIN -->
<div class="container">

    <!-- CREATE SIDE -->
    <div class="side">

        <div class="section-info">
            <b>Create a Room</b><br>
            Start a new collaborative coding session and invite others instantly.
        </div>

        <div class="card">
            <h2>Create Room</h2>

            <div class="form-group">
                <input type="text" id="roomName" placeholder="Room Name (optional)">
            </div>

            <div class="form-group">
                <select id="language">
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <button class="action" onclick="createRoom()">Create & Start</button>
            <div class="small">Room ID is auto-generated</div>
        </div>

    </div>

    <!-- DIVIDER -->
    <div class="divider"></div>

    <!-- JOIN SIDE -->
    <div class="side">

        <div class="section-info">
            <b>Join a Room</b><br>
            Enter an existing session using a Room ID or shared link.
        </div>

        <div class="card">
            <h2>Join Room</h2>

            <div class="form-group">
                <input type="text" id="joinInput" placeholder="Enter Room ID or link">
            </div>

            <button class="action" onclick="joinRoom()">Join Room</button>
        </div>

    </div>

</div>

<script>
    function createRoom(){
        const roomId = Math.random().toString(36).substring(2,8);
        const language = document.getElementById("language").value;

        window.location.href = `editor.html?room=${roomId}&lang=${language}`;
    }

    function joinRoom(){
        let input = document.getElementById("joinInput").value.trim();

        if(input.includes("room=")){
            window.location.href = input;
        }
        else {
            const language = document.getElementById("language").value || "java";

            window.location.href = `editor.html?room=${input}&lang=${language}`;
        }
    }


</script>

</body>
</html>
